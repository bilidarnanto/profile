<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | Bili Darnanto Susilo</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-page {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 80vh; text-align: center;
        }
        .error-code { font-size: 8rem; font-weight: 800; color: var(--accent-primary); line-height: 1; }
        .error-message { font-size: 1.5rem; color: var(--text-heading); margin: 1rem 0; }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    
    <div class="app-container">
        <div class="error-page">
            <div class="error-code">404</div>
            <p class="error-message">Oops! Halaman tidak ditemukan.</p>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Sepertinya link yang kamu tuju sudah tidak tersedia.</p>
            <a href="/" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Kembali ke Beranda
            </a>
        </div>
    </div>
</body>
</html>
